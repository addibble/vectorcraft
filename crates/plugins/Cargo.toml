[package]
name = "vectorcraft-plugins"
description = "Sandboxed WebAssembly plug-ins for VectorCraft: a resource-limited wasmi host for object filters and live effects"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
vectorcraft-geom = { workspace = true }
vectorcraft-color = { workspace = true }
vectorcraft-doc = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The pixels of a small image a filter asks to read, as RGBA in base64.
image = { workspace = true }
craft-vectorcraft-format = { workspace = true }
# The SHA-256 of a module, which the install prompt shows and a grant records.
sha2 = { version = "0.10", default-features = false }
thiserror = { workspace = true }
wasmi = { workspace = true }
# The monotonic clock of run deadlines and the first-view budget on wasm32: the page's
# `performance.now()`, which the web build turns on (`web-clock`; src/clock.rs). It is MIT OR
# Apache-2.0 and already in the build through eframe.
web-time = { version = "1", optional = true }

[features]
# The page's clock on wasm32 (web-time). Without it a wasm32 build reads no clock and imports
# nothing for one.
web-clock = ["dep:web-time"]

[dev-dependencies]
wat = { workspace = true }
